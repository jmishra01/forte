[package]
name = "forte"
version = "0.1.1"
description = "Simple markdown notes"
edition = "2021"

[lib]
name = "forte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
tempfile = "3"
